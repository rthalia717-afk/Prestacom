<!DOCTYPE html>
<html lang="es">
<head>
    <script>
        if (!localStorage.getItem('id_empresa')) {
            window.location.href = "login.html";
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRESTACOM 2.0 - Cuotas Atrasadas</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0F172A; color: #F8FAFC; display: flex; justify-content: center; height: 100vh; height: 100dvh; overflow: hidden; }
        .app-container { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; }
        header { background: #1E293B; color: white; padding: 18px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #334155; }
        .back-btn { background: none; border: none; color: #94A3B8; font-size: 1.6rem; cursor: pointer; display: flex; align-items: center; }
        .header-title h1 { font-size: 1.1rem; font-weight: 700; color: #F59E0B; }
        main { padding: 15px 20px; display: flex; flex-direction: column; flex: 1; min-height: 0; gap: 12px; }
        
        .alert-banner { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px; }
        .alert-banner i { color: #EF4444; font-size: 1.5rem; }
        .alert-banner div p { font-size: 0.7rem; color: #94A3B8; text-transform: uppercase; }
        .alert-banner div h3 { font-size: 1.1rem; color: #EF4444; font-weight: 700; }

        .cuotas-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 10px; }
        
        .cuota-card { background: #1E293B; border-left: 4px solid #EF4444; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #334155; border-left-width: 4px; }
        .cuota-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .client-info h4 { font-size: 0.9rem; font-weight: 700; color: #F8FAFC; }
        .client-info p { font-size: 0.72rem; color: #94A3B8; margin-top: 1px; }
        
        .badge- atraso { background: rgba(239, 68, 68, 0.15); color: #EF4444; font-size: 0.7rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; }

        .cuota-body { display: grid; grid-template-columns: 1fr 1fr; background: #0F172A; padding: 8px 10px; border-radius: 8px; font-size: 0.78rem; gap: 5px; }
        .cuota-body div p { color: #94A3B8; font-size: 0.68rem; }
        .cuota-body div span { font-weight: 700; color: #F8FAFC; }

        .cuota-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #334155; padding-top: 8px; font-size: 0.75rem; color: #94A3B8; }
        
        .btn-gestionar { background: #F59E0B; color: #0F172A; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 0.75rem; cursor: pointer; text-decoration: none; }

        .no-data { text-align: center; color: #94A3B8; font-size: 0.85rem; margin-top: 30px; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <button class="back-btn" onclick="window.location.href='index.html'"><i class='bx bx-left-arrow-alt'></i></button>
            <div class="header-title">
                <h1>Cuotas Atrasadas</h1>
            </div>
        </header>

        <main>
            <div class="alert-banner">
                <i class='bx bx-time-five'></i>
                <div>
                    <p>Total Cuotas Vencidas en Ruta</p>
                    <h3 id="txt-total-atrasadas">0 cuotas</h3>
                </div>
            </div>

            <div class="cuotas-container" id="lista-cuotas-atrasadas">
                <div class="no-data"><i class='bx bx-loader-alt bx-spin'></i> Buscando cuotas vencidas...</div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDbmVXLBIsBzk-wE60yVtchZ8WI4NWnAW4",
            authDomain: "prestacom-sistema-a2830.firebaseapp.com",
            projectId: "prestacom-sistema-a2830",
            storageBucket: "prestacom-sistema-a2830.firebasestorage.app",
            messagingSenderId: "500739174929",
            appId: "1:500739174929:web:1694f07bf65714606f77b0"
        };

        const db = getFirestore(initializeApp(firebaseConfig));
        const idEmpresa = localStorage.getItem('id_empresa');

        async function cargarCuotasAtrasadas() {
            const container = document.getElementById('lista-cuotas-atrasadas');
            try {
                const q = query(collection(db, "prestamos"), where("id_empresa", "==", idEmpresa), where("estado", "==", "activo"));
                const snapshot = await getDocs(q);
                
                let html = "";
                let contadorAtrasadas = 0;
                const hoy = new Date();
                hoy.setHours(0,0,0,0);

                snapshot.forEach(docSnap => {
                    const p = docSnap.data();
                    const fechaInicio = new Date(p.fecha_inicio);
                    const valorCuota = parseFloat(p.cuota || 0);
                    const cuotasPagadas = parseInt(p.cuotas_pagadas || 0);
                    const diasGracia = parseInt(p.dias_gracia || 0);

                    // Simulación o validación de cuota vencida basada en modalidad y fecha de inicio
                    // (Si el préstamo tiene cuotas pendientes y la fecha teórica superó el límite con gracia)
                    // Aquí preparamos la estructura visual limpia para cuando cruces el detalle de cuotas:
                });

                if (contadorAtrasadas === 0) {
                    container.innerHTML = `<div class="no-data">¡Impecable! No hay cuotas vencidas ni atrasadas en este momento.</div>`;
                } else {
                    container.innerHTML = html;
                    document.getElementById('txt-total-atrasadas').innerText = `${contadorAtrasadas} cuotas`;
                }

            } catch (error) {
                container.innerHTML = `<div class="no-data" style="color: #EF4444;">Error al cargar los datos de atraso.</div>`;
            }
        }

        cargarCuotasAtrasadas();
    </script>
</body>
</html>
