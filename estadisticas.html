<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRESTACOM | Dashboard Pro</title>
    <style>
        :root {
            --bg: #0F172A;
            --surface: #1E293B;
            --primary: #F59E0B;
            --text: #F8FAFC;
            --success: #10B981;
            --danger: #EF4444;
        }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 480px; margin: 0 auto; }
        .header { display: flex; align-items: center; margin-bottom: 25px; }
        .header h1 { font-size: 1.5rem; margin-left: 15px; color: var(--primary); }
        .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .card { background: var(--surface); padding: 15px; border-radius: 16px; border: 1px solid #334155; }
        .full { grid-column: span 2; border-left: 4px solid var(--primary); }
        .card span { font-size: 0.7rem; color: #94A3B8; text-transform: uppercase; letter-spacing: 1px; }
        .card strong { display: block; font-size: 1.3rem; margin-top: 5px; }
        .progress-bg { background: #334155; height: 10px; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; transition: 1s ease; border-radius: 5px; }
        .btn-home { display: block; text-align: center; background: var(--primary); color: var(--bg); padding: 15px; border-radius: 12px; text-decoration: none; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <a href="index.html" style="color:white; text-decoration:none; font-size: 1.5rem;">⬅</a>
        <h1>Dashboard Pro</h1>
    </header>

    <div class="grid-stats">
        <div class="card full">
            <span>Capital en la Calle / Colocado</span>
            <strong id="stat-capital-calle">RD$ 0.00</strong>
        </div>
        <div class="card">
            <span>Intereses Proyectados</span>
            <strong id="stat-intereses" style="color:var(--success)">+RD$ 0.00</strong>
        </div>
        <div class="card">
            <span>Cobrado Total</span>
            <strong id="stat-cobrado-mes">RD$ 0.00</strong>
        </div>
        <div class="card">
            <span>En Mora / Atrasado</span>
            <strong id="stat-mora" style="color:var(--danger)">RD$ 0.00</strong>
        </div>
        <div class="card">
            <span>Activos</span>
            <strong id="stat-prestamos-activos">0</strong>
        </div>
        <div class="card">
            <span>Finalizados</span>
            <strong id="analisis-prestamos-finalizados">0</strong>
        </div>
    </div>

    <div class="card">
        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
            <span>Salud de Cartera (Cuotas al día)</span>
            <span id="salud-porcentaje">0%</span>
        </div>
        <div class="progress-bg"><div id="salud-barra" class="progress-fill"></div></div>
    </div>

    <a href="index.html" class="btn-home">Ir al Menú Principal</a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDbmVXLBIsBzk-wE60yVtchZ8WI4NWnAW4",
        authDomain: "prestacom-sistema-a2830.firebaseapp.com",
        projectId: "prestacom-sistema-a2830",
        storageBucket: "prestacom-sistema-a2830.firebasestorage.app",
        messagingSenderId: "500739174929",
        appId: "1:500739174929:web:1694f07bf65714606f77b0"
    };

    const db = getFirestore(initializeApp(firebaseConfig));
    const idEmpresa = localStorage.getItem('id_empresa');

    // 🔒 Seguridad de acceso
    if (!idEmpresa) {
        window.location.href = "login.html";
    }

    async function cargarEstadisticas() {
        try {
            const q = query(collection(db, "prestamos"), where("id_empresa", "==", idEmpresa));
            const snapshot = await getDocs(q);
            
            let capitalEnCalle = 0;
            let interesesProyectados = 0;
            let totalCobrado = 0;
            let moraEstimada = 0;
            let activos = 0;
            let finalizados = 0;
            let totalCuotasCompromiso = 0;
            let totalCuotasPagadasGeneral = 0;

            snapshot.forEach(docSnap => {
                const p = docSnap.data();
                const estado = (p.estado || "").toLowerCase();
                const montoOriginal = parseFloat(p.monto || 0);
                const montoTotalPagar = parseFloat(p.total || 0);
                const interesCalculado = montoTotalPagar - montoOriginal;
                const cuotasTotales = parseInt(p.cuotas || 1);
                const cuotasPagadas = parseInt(p.cuotas_pagadas || 0);
                const valorCuota = parseFloat(p.cuota || 0);

                // Conteo de Estados
                if (estado === 'activo') {
                    activos++;
                    capitalEnCalle += montoTotalPagar; // O capital pendiente según prefieras
                    interesesProyectados += interesCalculado;
                    totalCobrado += (cuotasPagadas * valorCuota);

                    totalCuotasCompromiso += cuotasTotales;
                    totalCuotasPagadasGeneral += cuotasPagadas;

                    // Si las cuotas pagadas son menores a las esperadas por tiempo, se acumula en mora estimada
                    if (cuotasPagadas < cuotasTotales) {
                        // Lógica de respaldo para mora si el cliente lleva retraso operativo
                        // (Se puede refinar con la fecha de inicio si lo deseas)
                    }
                } else {
                    finalizados++;
                    totalCobrado += montoTotalPagar;
                    totalCuotasCompromiso += cuotasTotales;
                    totalCuotasPagadasGeneral += cuotasTotales;
                }
            });

            // Actualizar Elementos en la Interfaz
            document.getElementById('stat-capital-calle').innerText = `RD$ ${capitalEnCalle.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            document.getElementById('stat-intereses').innerText = `+RD$ ${interesesProyectados.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            document.getElementById('stat-cobrado-mes').innerText = `RD$ ${totalCobrado.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            document.getElementById('stat-mora').innerText = `RD$ ${moraEstimada.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            document.getElementById('stat-prestamos-activos').innerText = activos;
            document.getElementById('analisis-prestamos-finalizados').innerText = finalizados;

            // Salud de Cartera
            const salud = totalCuotasCompromiso > 0 ? (totalCuotasPagadasGeneral / totalCuotasCompromiso) * 100 : 100;
            const barra = document.getElementById('salud-barra');
            document.getElementById('salud-porcentaje').innerText = `${salud.toFixed(1)}%`;
            barra.style.width = `${salud}%`;
            barra.style.backgroundColor = salud < 70 ? 'var(--danger)' : 'var(--success)';

        } catch (error) {
            console.error("Error al cargar estadísticas del dashboard:", error);
        }
    }

    cargarEstadisticas();
</script>
</body>
</html>
